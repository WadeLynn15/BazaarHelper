name: English Build (Windows)

# Builds an unsigned Windows installer of the English translation.
# Mirrors the developer's local deploy.ps1 environment (official OpenCV 4.12 package at C:\opencv).

on:
  push:
    branches:
      - english
  workflow_dispatch:

concurrency:
  group: english-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install OpenCV 4.12.0 (official Windows package)
        shell: pwsh
        run: |
          $url = "https://github.com/opencv/opencv/releases/download/4.12.0/opencv-4.12.0-windows.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\opencv.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\opencv.exe" -ArgumentList '-oC:\','-y' -Wait
          if (-not (Test-Path "C:\opencv\build\x64\vc16\bin\opencv_world4120.dll")) {
            Get-ChildItem C:\opencv\build\x64 -Recurse -Filter "opencv_world*" | Select-Object FullName
            throw "OpenCV DLL not found at expected path"
          }
          echo "OPENCV_LINK_LIBS=opencv_world4120" >> $env:GITHUB_ENV
          echo "OPENCV_LINK_PATHS=C:\opencv\build\x64\vc16\lib" >> $env:GITHUB_ENV
          echo "OPENCV_INCLUDE_PATHS=C:\opencv\build\include" >> $env:GITHUB_ENV
          echo "OPENCV_MSVC_CRT=dynamic" >> $env:GITHUB_ENV
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          echo "C:\opencv\build\x64\vc16\bin" >> $env:GITHUB_PATH

      - name: Point installer hook at this checkout
        shell: pwsh
        run: |
          $nsh = "src-tauri/installer.nsh"
          $src = Join-Path $env:GITHUB_WORKSPACE "src-tauri"
          (Get-Content $nsh -Raw).Replace("D:\Projects\BazaarHelper\src-tauri", $src) | Set-Content $nsh -NoNewline
          Get-Content $nsh

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tauri app (Windows, NSIS)
        run: npm run tauri build -- --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BazaarHelper-English-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
